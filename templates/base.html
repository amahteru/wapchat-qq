<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.0//EN" "http://www.wapforum.org/DTD/xhtml-mobile10.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>{% block title %}WapChat QQ{% endblock %}</title>
    <style type="text/css">
/* <![CDATA[ */
        body { margin: 0; padding: 0; background-color: #ffffff; color: #000000; font-size: medium; }
        h2 { font-size: medium; margin: 0; padding: 2px 0.2em; border-bottom: 2px solid #000; background-color: #ffffff; line-height: 1.3; }
        .back { float: right; }
        .back a { font-size: medium; font-weight: normal; color: red; text-decoration: none; }
        .panel { padding: 0.2em; }
        a { color: #0000ff; }
{% block css %}{% endblock %}
{% if theme == 'dark' %}
        html, body { background-color: #000000 !important; color: #999999 !important; }
        h2 { border-bottom: 2px solid #333333 !important; background-color: #000000 !important; color: #cccccc !important; }
        .panel { background: #000000 !important; }
        input[type="text"], input[type="password"] { background-color: #000000 !important; color: #ffffff !important; border-color: #333333 !important; }
        input[type="button"], input[type="submit"] { background-color: #333333 !important; color: #cccccc !important; border-color: #333333 !important; }
{% block dark_css %}{% endblock %}
{% endif %}
    /* ]]> */
    </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
