<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.0//EN" "http://www.wapforum.org/DTD/xhtml-mobile10.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>{% block title %}WapChat QQ{% endblock %}</title>
    <style type="text/css">
/* <![CDATA[ */
        body { margin: 0; padding: 0; background-color: #ffffff; color: #000000; font-size: medium; }
        h2 { font-size: medium; margin: 0; padding: 0.2em; border-bottom: 2px solid #000000; line-height: 1.3; }
        a { color: #0000ff; text-decoration: none; }
        form { margin: 0; }
        .back { float: right; }
        .back a { font-weight: normal; color: #ff0000; }
        .panel { padding: 0.2em; }
        .input-area { padding: 0.2em; border-bottom: 2px solid #000000; }
        .label { display: block; margin-bottom: 0.2em; }
        .txt { height: 21px; padding: 1px 2px; border: 1px solid #000000; font-size: medium; }
        .btn { height: 25px; padding: 0 0.4em; border: 1px solid #000000; background-color: #cccccc; color: #000000; font-size: medium; font-weight: bold; cursor: pointer; }
        .file { display: block; margin-bottom: 0.2em; }
        .notice { color: #ff6600; font-weight: bold; margin-bottom: 0.2em; }
        .tip { color: #666666; margin-top: 0.2em; }
        .links { margin-top: 0.2em; }
        .msg, .item { border-bottom: 1px dashed #cccccc; padding: 0.2em 0; line-height: 1.3; word-wrap: break-word; }
        .msg-title, .item-meta, .reply-text { font-size: small; }
        .msg-title { margin-bottom: 0.1em; }
        .item-meta { color: #666666; }
        .reply-text, .action-reply { color: #ff6600; }
        .nav { padding: 0.2em; text-align: center; }
        .nav form { display: inline; }
{% block css %}{% endblock %}
{% if theme == 'dark' %}
        body { background-color: #000000 !important; color: #999999 !important; }
        h2 { color: #cccccc !important; }
        h2, .input-area { border-bottom-color: #333333 !important; }
        .msg, .item { border-bottom-color: #333333 !important; }
        .tip, .item-meta { color: #999999 !important; }
        .txt { background-color: #000000 !important; color: #ffffff !important; border-color: #333333 !important; }
        .btn, .kmj { background-color: #333333 !important; color: #cccccc !important; border-color: #333333 !important; }
        .notice { color: #ff9933 !important; }
{% endif %}
    /* ]]> */
    </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
