<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.0//EN" "http://www.wapforum.org/DTD/xhtml-mobile10.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>{% block title %}WapChat QQ{% endblock %}</title>
    <style type="text/css">
/* <![CDATA[ */
        body { margin: 0; padding: 0; background-color: #ffffff; color: #000000; font-size: medium; }
        h2 { font-size: medium; margin: 0; padding: 2px 0.2em; border-bottom: 2px solid #000000; line-height: 1.3; }
        .back { float: right; }
        .back a { font-weight: normal; color: #ff0000; text-decoration: none; }
        a { color: #0000ff; }
        form { margin: 0; }
        .panel { padding: 0.2em; }
        .input-area { padding: 0.2em; border-bottom: 2px solid #000000; }
        .label { display: block; margin-bottom: 0.2em; }
        input[type="text"], input[type="password"] { height: 21px; padding: 1px 2px; border: 1px solid #000000; font-size: medium; }
        input[type="submit"] { height: 25px; padding: 0 6px; border: 1px solid #000000; background-color: #cccccc; color: #000000; font-size: medium; font-weight: bold; cursor: pointer; }
        .notice { color: #ff6600; font-weight: bold; margin-bottom: 0.2em; }
        .tip { font-size: small; color: #666666; }
        .links { margin-top: 0.2em; }
        .links a { text-decoration: none; margin-right: 0.3em; }
{% block css %}{% endblock %}
{% if theme == 'dark' %}
        body { background-color: #000000 !important; color: #999999 !important; }
        h2 { border-bottom-color: #333333 !important; color: #cccccc !important; }
        .input-area { border-bottom-color: #333333 !important; }
        input[type="text"], input[type="password"] { background-color: #000000 !important; color: #ffffff !important; border-color: #333333 !important; }
        input[type="submit"] { background-color: #333333 !important; color: #cccccc !important; border-color: #333333 !important; }
        .notice { color: #ff9933 !important; }
{% block dark_css %}{% endblock %}
{% endif %}
    /* ]]> */
    </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
