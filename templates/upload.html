{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}上传{% endblock %}
{% block body %}
{{ ui.header("上传") }}

    <div class="input-area">
        {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
        <form method="post" action="/upload/image" enctype="multipart/form-data">
            <span class="label">发图片:</span>
            <input type="file" class="file" name="image" accept="image/*" />
            <input type="submit" class="btn" value="发送图片" />
        </form>
    </div>

    <div class="input-area">
        <form method="post" action="/upload/file" enctype="multipart/form-data">
            <span class="label">发文件 (最大15MB):</span>
            <input type="file" class="file" name="file" />
            <input type="submit" class="btn" value="发送文件" />
        </form>
    </div>

    <div class="panel tip">部分老手机的浏览器不支持上传文件，选不了文件时请换浏览器。</div>
{% endblock %}
